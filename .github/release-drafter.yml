name-template: v$RESOLVED_VERSION
tag-template: v$RESOLVED_VERSION

categories:
  - title: Breaking changes
    labels:
      - breaking
  - title: Features
    labels:
      - feature
      - enhancement
  - title: Bug fixes
    labels:
      - bug
      - fix
  - title: Dependencies
    labels:
      - dependencies

# Applied by the autolabel job in workflows/release-drafter.yml from
# conventional-commit PR titles; Dependabot labels its own PRs `dependencies`.
autolabeler:
  - label: breaking
    title:
      - '/^[a-z]+(\(.+\))?!:/'
  - label: feature
    title:
      - '/^feat(\(.+\))?:/'
  - label: fix
    title:
      - '/^fix(\(.+\))?:/'

version-resolver:
  major:
    labels:
      - breaking
  minor:
    labels:
      - feature
      - enhancement
  default: patch

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
template: |
  ## What's changed

  $CHANGES
