name: Release Drafter

on:
  push:
    branches:
      - main
  pull_request:
    # The only PR event types the autolabeler acts on.
    types:
      - opened
      - reopened
      - synchronize

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draft-release:
    name: Draft release notes
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/update the draft release
      pull-requests: read # enumerate merged PRs and labels for the changelog
    steps:
      - name: Update the release draft
        uses: release-drafter/release-drafter@eada3c96a64734dd381cfbda23511034e328ddb0 # v7.6.0
        with:
          commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Applies the labels that drive the categories and version-resolver in
  # .github/release-drafter.yml, keyed off conventional-commit PR titles.
  # Fork PRs are skipped: their token cannot write labels.
  autolabel:
    name: Autolabel pull request
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # apply labels to the pull request
    steps:
      - name: Apply labels from the PR title
        uses: release-drafter/release-drafter/autolabeler@eada3c96a64734dd381cfbda23511034e328ddb0 # v7.6.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
